<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>MBlue Diagnostics</title>
    <link rel="stylesheet" href="/UI/mblue-colors.css" type="text/css"/>
    <link rel="stylesheet" href="/UI/mblue.css" type="text/css"/>
    <link rel="stylesheet" href="/UI/diag.css" type="text/css"/>
    <noscript>
        <p color="red">
        Your browser does not support Javascript. This won't work for you.
        </p>
    </noscript>
</head>
<body id="mb-body">
<div id="mb-header">Diagnostics</div>
<div id="mb-content">
    <!-- ============================================== -->
    <div class="mb-section">
        <a class="mb-sectionHeader" href="#">Login</a>
        <div id="mb-login" class="mb-SectionContent">
            <table id="mb-gridLogin-table">
                <tr>
                    <td class="mb-textDisplay mb-textRight">First name: </td>
                    <td><input type="text" id="mb-gridLogin-first" size="40" maxlength="40"/></td>
                </tr>
                <tr>
                    <td class="mb-textDisplay mb-textRight">Last name: </td>
                    <td><input type="text" id="mb-gridLogin-last" size="40" maxlength="40"/></td>
                </tr>
                <tr>
                    <td class="mb-textDisplay mb-textRight">Password: </td>
                    <td><input type="password" id="mb-gridLogin-password" size="40" maxlength="40"/></td>
                </tr>
                <tr>
                    <td class="mb-textDisplay mb-textRight">Grid: </td>
                    <td>
                        <select size="1" id="mb-gridLogin-gridSelect">
                            <option selected value="OSGrid">OSGrid</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="mb-textDisplay mb-textRight">Start location: </td>
                    <td><input type="text" id="mb-gridLogin-startLoc" size="40" maxlength="64" value="Last"/></td>
                </tr>
                <tr>
                    <td colspan="2" class="mb-textCenter">
                        <input type="button" id="mb-gridLogin-loginButton" class="mb-button mb-clickable" op="gridLogin" value="Login"/>
                        <!-- <input type="button" id="mb-gridLogin-logoutButton" value="Logout" disabled="disabled"/> -->
                        <input type="button" id="mb-gridLogin-logoutButton" class="mb-button mb-clickable" op="gridLogout" value="Logout"/>
                        <input type="button" id="mb-gridLogin-exitButton" class="mb-button mb-clickable" op="gridExit" value="Exit"/>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="mb-textCenter">
                        <input type="button" id="mb-gridLogin-refetchGridsButton" class="mb-button mb-clickable" op="refetchGrids" value="Refetch Grids"/>
                    </td>
                </tr>
            </table>
        </div>  <!-- mb-login -->
    </div>  <!-- mb-section -->

    <!-- ============================================== -->
    <div class="mb-section">
        <a class="mb-sectionHeader" href="#">Chat</a>
        <div id="mb-chat" class="mb-section">
            <textarea name="chattext" rows="10" cols="80"></textarea>
        </div>  <!-- mb-chat -->
    </div>  <!-- mb-section -->

    <!-- ============================================== -->
    <div class="mb-section">
        <a class="mb-sectionHeader" href="#">Inventory</a>
        <div id="mb-inventory" class="mb-section">
            <p>Look at all the stuff in my inventory</p>
        </div>  <!-- mb-inventory -->
    </div>  <!-- mb-section -->

    <!-- ============================================== -->
    <div class="mb-section">
        <a class="mb-sectionHeader" href="#">Statistics</a>
        <div id="mb-statistics" class="mb-section">
            <div id="mb-stats">
            </div>  <!-- mb-statsComm -->
            <div id="mb-statsComm">
            </div>  <!-- mb-statsComm -->
        </div>  <!-- mb-statistics -->
    </div>  <!-- mb-section -->

    <!-- ============================================== -->
</div>  <!-- mb-content -->
<div id="mb-DEBUGG"></div>
<div id="mb-footer"></div>
</body>
<script type="module" src="/UI/diag.js"></script>
</html>
