<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>MBlue</title>
<link rel="stylesheet" href="/static/mblue.css" type="text/css">
<script type="application/javascript" src="/std/jquery.js"></script>
<script type="application/javascript" src="/std/jquery.form.js"></script>
<script type="application/javascript">
$(document).ready(function() {
    var formOptions = {
        dataType: 'json',
        success: function(resp) {
        }
    };

    $('MBLoginForm').ajaxForm(formOptions);
    // var timerHande = SetTimeout(fetchLoginStuff, 1000);
    // var statHandle = SetTimeout(fetchDataStuff, 1000);
} 
);
</script>
</head>
<body id="MBBody">
<div id="MBContent">
<form id="MBLoginForm" action="/api/LLLP/connection/login" method="post">
    <ul class="MBLogin">
        <li class="MBLogin">
            <span class="MBLoginLabel">First</span>
            <span class="MBLoginValue"><input type="text" name="LOGINFIRST"/></span>
        </li>
        <li class="MBLogin">
            <span class="MBLoginLabel">Last</span>
            <span class="MBLoginValue"><input type="text" name="LOGINLAST"/></span>
        </li>
        <li class="MBLogin">
            <span class="MBLoginLabel">Password</span>
            <span class="MBLoginValue"><input type="password" name="LOGINPASS"/></span>
        </li>
        <li class="MBLogin">
            <span class="MBLoginLabel">Grid</span>
            <span class="MBLoginValue"><input type="text" name="LOGINGRID"/></span>
        </li>
        <li class="MBLogin">
            <span class="MBLoginLabel">Sim</span>
            <span class="MBLoginValue"><input type="text" name="LOGINSIM"/></span>
        </li>
    </ul>
    <span class="MBLoginSubmit">
        <input type="submit" value="Login"/>
    </span>
</div>
</body>
</html>
