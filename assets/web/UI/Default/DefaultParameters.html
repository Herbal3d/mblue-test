<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>MBlue</title>
<link rel="stylesheet" href="/static/mblue.css" type="text/css"/>
<script type="application/javascript" src="/static/jquery.js"></script>
<script type="application/javascript" src="/static/MBScripts.js"></script>
<script type="application/javascript">
$(document).ready(function() {
    GetDefaultParameters();
});

var BASEURL='http://127.0.0.1:9144';
function GetDefaultParameters() {
    $.ajax({
        type: "GET",
        url: BASEURL + '/api/params/Default',
        dataType: 'json',
        timeout: 5000,
        success: function(data, status) {
            if (status == 'success') {
                BuildBasicTable('#MBDefaultParameters', data, true, false);
            }
        },
        error: function(xmlHTTPRequest, errorType) {
            $('#MBDefaultParameters').append('Could not read parameters');
        }
    });
};

</script>
</head>
<body id="MBBody">
<div id="MBHeader"></div>
<div id="MBContent">

<div class="MBSectionContainer">
<a class="MBSectionHeader" href="#">Default Parameters</a>
<p>These are all the parameters that can be modified in MBlue.
The values given are the default values. The "settings.file" file
(usually "mblue.json") overrides any of these values.
</p>
<div id="MBDefaultParameters" class="MBSection">
</div>  <!-- MBDefaultParameters -->
</div>  <!-- MBSectionContainer -->

<!-- ============================================== -->
</div>  <!-- MBContent -->
<div id="DEBUG"></div>
<div id="MBFooter"></div>
</body>
</html>
